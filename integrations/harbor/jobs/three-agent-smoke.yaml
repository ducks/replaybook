jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 3
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - name: codex
    model_name: gpt-5.6-sol
    n_concurrent: 1
    env:
      CODEX_FORCE_AUTH_JSON: "1"

  - name: claude-code
    model_name: claude-sonnet-5
    n_concurrent: 1
    env:
      CLAUDE_FORCE_OAUTH: "1"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}

  - import_path: integrations.harbor.claux_agent:ClauxAgent
    model_name: deepseek/deepseek-v4-flash
    n_concurrent: 1
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

tasks:
  - path: integrations/harbor/tasks/001-nginx-502
