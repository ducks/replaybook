services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app
    networks:
      - incident

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    networks:
      - incident

networks:
  incident:
