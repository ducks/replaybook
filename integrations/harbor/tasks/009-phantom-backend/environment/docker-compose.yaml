services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app
      - backend
      - backend-canary
    networks:
      - incident

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - incident

  backend-canary:
    build:
      context: .
      dockerfile: Dockerfile.canary
    networks:
      - incident

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - backend
      - backend-canary
    volumes:
      - app-state:/var/lib/replaybook
    networks:
      - incident

volumes:
  app-state:

networks:
  incident:
