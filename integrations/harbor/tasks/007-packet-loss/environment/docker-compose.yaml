services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app
      - backend
    networks:
      - incident

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - incident

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      BACKEND_URL: http://backend:9000/ping
    cap_add:
      - NET_ADMIN
    depends_on:
      - backend
    volumes:
      - app-state:/var/lib/replaybook
    networks:
      - incident

volumes:
  app-state:

networks:
  incident:
