name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "benchmark-data/**"
      - "benchmarks.md"
      - "integrations/host/publish_benchmarks.py"
      - "site/**"
      - "requirements-site.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install site dependencies
        run: python -m pip install -r requirements-site.txt
      - name: Verify generated benchmark pages
        run: python integrations/host/publish_benchmarks.py check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
