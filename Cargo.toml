[package]
name = "replaybook"
version = "20260823.0.1"
edition = "2024"
description = "Incident replay trainer - fix broken infrastructure in real Docker environments"
license = "MIT"

[[bin]]
name = "replaybook"
path = "src/main.rs"

[[bin]]
name = "replay"
path = "src/replay.rs"

[[bin]]
name = "replaybook-api"
path = "services/replaybook-api/src/main.rs"

[[bin]]
name = "replaybook-worker"
path = "services/replaybook-api/src/worker.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
