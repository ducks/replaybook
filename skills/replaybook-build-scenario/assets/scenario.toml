[scenario]
version = 1
nixos_config = "nixos.nix"
instruction = "instruction.md"
oracle = "oracle.sh"
required_services = ["example.service"]
restart_services = ["example.service"]

[[preflight.steps]]
type = "wait_http"
path = "/health"
expected_status = 200
expected_body = "degraded"
timeout_seconds = 60
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[verify.steps]]
type = "wait_http"
path = "/health"
expected_status = 200
expected_body = "ok"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "repair_incomplete"
